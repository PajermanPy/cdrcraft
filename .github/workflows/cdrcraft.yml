name: cdrcraft

# Pruebas en cada envío y, con una etiqueta de versión (v2.0.0), los
# instaladores de Linux y Windows publicados como versión de GitHub.
# Las tareas originales de TraceDraw quedan apagadas en
# .github/workflows-tracedraw (GitHub solo ejecuta esta carpeta).
#
# Configuración del repositorio (Settings > Secrets and variables > Actions):
#   secreto  CDRCRAFT_CRASH_DSN  dirección del servicio de informes de fallos
#   variable CDRCRAFT_REPO       https://github.com/<usuario>/cdrcraft (opcional)

on:
  push:
    branches: [main, cdrcraft]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  CDRCRAFT_REPO: ${{ vars.CDRCRAFT_REPO || format('https://github.com/{0}', github.repository) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Bibliotecas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev
      - run: cargo test --release -p tracedraw-cdr -p tracedraw-cli
      - run: cargo test --release -p tracedraw

  # Arma Linux y Windows en cada envío a main y en cada etiqueta, prueba
  # los programas armados y, solo con una etiqueta, publica la versión.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CDRCRAFT_CRASH_DSN: ${{ secrets.CDRCRAFT_CRASH_DSN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Bibliotecas del sistema
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev xvfb
      - name: La etiqueta coincide con la versión del programa
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(sed -n 's/^pub const VERSION: &str = "\(.*\)";/\1/p' apps/tracedraw/src/ui/brand.rs)
          test "v$v" = "${{ github.ref_name }}" || { echo "etiqueta ${{ github.ref_name }} y versión v$v distintas"; exit 1; }
      - run: cargo build --release --locked -p tracedraw -p tracedraw-cli
      - name: Probar la línea de comandos
        shell: bash
        run: |
          set -e
          cli=target/release/tracedraw-cli
          f=crates/cdr/tests/fixtures/gaussian-blur.cdr
          $cli info "$f"
          for x in svg pdf png eps; do
            $cli convert "$f" "prueba.$x"
            test -s "prueba.$x" || { echo "prueba.$x vacío"; exit 1; }
          done
          $cli convert prueba.svg vuelta.cdr && $cli info vuelta.cdr
      - name: Probar que el programa abre (Linux)
        if: runner.os == 'Linux'
        run: |
          export TRACEDRAW_CONFIG_DIR=$PWD/conf
          xvfb-run -a timeout 20 target/release/tracedraw crates/cdr/tests/fixtures/gaussian-blur.cdr || rc=$?
          # 124 = seguía abierto a los 20 s, que es lo esperado
          test "${rc:-0}" = 124 || { echo "el programa se cerró solo (código ${rc:-0})"; exit 1; }
      - name: Probar que el programa abre (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TRACEDRAW_CONFIG_DIR = "$PWD\conf"
          $p = Start-Process target/release/tracedraw.exe -ArgumentList "crates/cdr/tests/fixtures/gaussian-blur.cdr" -PassThru
          Start-Sleep 20
          if ($p.HasExited) { Write-Error "el programa se cerró solo (código $($p.ExitCode))"; exit 1 }
          Stop-Process $p.Id
      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          d=cdrcraft-${{ github.ref_name }}-${{ matrix.name }}
          mkdir -p $d/icon
          cp target/release/tracedraw $d/cdrcraft
          cp target/release/tracedraw-cli $d/cdrcraft-cli
          cp packaging/linux/cdrcraft.desktop $d/
          cp -r assets/icon/* $d/icon/
          cp README.md CDRCRAFT.md PRIVACY.md LICENSE-MIT LICENSE-APACHE ATTRIBUTION.md $d/
          tar czf $d.tar.gz $d
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "cdrcraft-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/tracedraw.exe "$d/cdrcraft.exe"
          Copy-Item target/release/tracedraw-cli.exe "$d/cdrcraft-cli.exe"
          Copy-Item README.md, CDRCRAFT.md, PRIVACY.md, LICENSE-MIT, LICENSE-APACHE, ATTRIBUTION.md $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: cdrcraft-${{ matrix.name }}
          path: |
            cdrcraft-*.tar.gz
            cdrcraft-*.zip
          retention-days: 7
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            cdrcraft-*.tar.gz
            cdrcraft-*.zip
